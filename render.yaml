# Linnea na nuvem (Render, plano grátis). As chaves (sync: false) não ficam aqui: vão direto no painel do Render.
services:
  - type: web
    name: linnea-ai
    runtime: python
    rootDir: backend # o código Python fica na pasta backend/
    plan: free
    region: virginia # perto do Supabase (us-east-1)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: LINNEA_MODO
        value: nuvem # login obrigatório e dados do último retrato do PC
      - key: LINNEA_HOME
        value: /tmp/linnea # onde o retrato baixado fica guardado no servidor
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_API_SECRET_KEY
        sync: false
      - key: SUPABASE_API_PUBLISH_KEY
        sync: false
